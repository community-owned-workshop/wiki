site_name: Community Owned Workshop
site_description: Community-owned mods, maintained together.
site_url: https://community-owned-workshop.github.io/wiki/

repo_name: community-owned-workshop/wiki
repo_url: https://github.com/community-owned-workshop/wiki
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/cow-mark.svg
  favicon: assets/cow-mark.svg
  palette:
    scheme: slate
    primary: blue grey
    accent: light blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.action.edit
    - content.code.copy

nav:
  - Home: index.md
  - Organization:
      - Code of Conduct: github/CODE_OF_CONDUCT.md
      - Contributing: github/CONTRIBUTING.md
      - Governance: github/GOVERNANCE.md
      - Security: github/SECURITY.md
  - Tools:
      - GitHub Actions: steam-workshop-devops/index.md
  - Project Zomboid:
      - GitHub Actions: steam-workshop-devops/project-zomboid/index.md
      - Mod Template: project-zomboid-template/getting-started.md
      - Mod Template Tools: project-zomboid-template/tools.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

